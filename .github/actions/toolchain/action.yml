name: toolchain
description: Install and cache what scripts/release.sh needs on this runner.

inputs:
  target:
    required: true
  kind:
    description: test or build, so test and release builds keep separate caches
    required: true

runs:
  using: composite
  steps:
    - if: runner.os == 'macOS'
      uses: cachix/install-nix-action@v31
    - if: runner.os == 'macOS'
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ inputs.target }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-prefixes-first-match: nix-${{ inputs.target }}-
        gc-max-store-size: 8G
    - if: runner.os == 'macOS'
      shell: bash
      run: nix --extra-experimental-features 'nix-command flakes' develop -c true
    # The musl test build fills the runner's disk; drop toolchains this repo never uses.
    - if: runner.os == 'Linux'
      shell: bash
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL && df -h /
    # The engine's build script builds the web app with bun; the macOS nix shell has its own.
    - if: runner.os != 'macOS'
      uses: oven-sh/setup-bun@v2
    # dumpbin, which scripts/release.ps1 uses to check the binary.
    - if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
    - uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: cargo-${{ inputs.kind }}-${{ inputs.target }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
        restore-keys: |
          cargo-${{ inputs.kind }}-${{ inputs.target }}-${{ hashFiles('Cargo.lock') }}-
          cargo-${{ inputs.kind }}-${{ inputs.target }}-
