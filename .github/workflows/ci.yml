name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # The bun the flake's nixpkgs gives `nix develop`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun test

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          kind: test
      - run: scripts/release.sh test

  windows:
    runs-on: windows-latest
    steps:
      # Tests compare files byte for byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
        with:
          target: x86_64-pc-windows-msvc
          kind: test
      - run: cargo test --workspace --locked --no-fail-fast
      - name: The pinned ffmpeg build fetches, runs, and has what conversions use
        run: cargo test --locked -p newsreel-daemon the_pinned_build_runs_here -- --ignored
      - name: The logon task starts the engine, and uninstalling it stops the engine
        shell: pwsh
        run: |
          cargo build --locked -p newsreel
          $exe = (Resolve-Path target\debug\newsreel.exe).Path
          function Engine { (& $exe engine status --json | ConvertFrom-Json).engine }
          & $exe engine install
          if ($LASTEXITCODE) { throw 'engine install failed' }
          schtasks /Query /TN 'newsreel engine' /V /FO LIST
          $deadline = (Get-Date).AddSeconds(60)
          while ((Engine) -ne 'running') {
            if ((Get-Date) -gt $deadline) {
              Get-Content "$env:LOCALAPPDATA\newsreel\state\engine.log" -ErrorAction SilentlyContinue
              throw 'the logon task did not start the engine within 60 s'
            }
            Start-Sleep 2
          }
          & $exe engine status
          & $exe engine uninstall
          if ($LASTEXITCODE) { throw 'engine uninstall failed' }
          schtasks /Query /TN 'newsreel engine' 2>$null
          if (-not $LASTEXITCODE) { throw 'the task is still registered' }
          if ((Engine) -ne 'stopped') { throw 'the engine still runs after uninstall' }
          $global:LASTEXITCODE = 0
