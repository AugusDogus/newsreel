[package]
name = "newsreel"
description = "Search Usenet indexers, and download or stream releases, from a terminal or a coding agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "newsreel"
path = "src/main.rs"

[dependencies]
newsreel-core = { path = "../core" }
newsreel-daemon = { path = "../daemon" }
newsreel-search = { path = "../search" }
newsreel-tui = { path = "../tui" }
anstream = "1"
anstyle = "1"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
ctrlc = "3.5"
globset = "0.4"
httparse = "1.10"
indicatif = "0.18"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.53", features = ["rt"] }
url = "2.5"

[dev-dependencies]
usenet = { git = "https://github.com/AugusDogus/usenet-rs", rev = "ac04b12cbce5e2e15852fc0f7cbc54130ecb29bf", features = ["fake"] }
assert_cmd = "2.2"
flate2 = "1"
insta = { version = "1.49", features = ["json"] }
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3.27"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
