[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AugusDogus/newsreel"

# The search matches every result against TRaSH Guides' patterns; unoptimized, that alone
# makes tests slow.
[profile.dev.package.fancy-regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
